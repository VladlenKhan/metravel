services:
  postgres:
    image: postgres:16-alpine
    container_name: metravel-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metravel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: metravel-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  monolith:
    build:
      context: ./server
      dockerfile: Monolith/Presentation/Dockerfile
    container_name: metravel-monolith
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=metravel;Username=postgres;Password=postgres
      Jwt__Issuer: MeTravel
      Jwt__Audience: MeTravel.Clients
      Jwt__Secret: super-secret-development-key-change-me-2026
      Jwt__ExpiresInMinutes: 60
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Ai__RecommendationModelPath: App_Data/ai/tour-recommendation-model.json
      SeedAdminUser__Enabled: true
      SeedAdminUser__FullName: System Admin
      SeedAdminUser__Email: admin@metravel.local
      SeedAdminUser__Password: admin123
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5066:8080"
    volumes:
      - monolith-ai-data:/app/App_Data/ai

  bookingservice:
    build:
      context: ./server
      dockerfile: BookingService/Api/Dockerfile
    container_name: metravel-bookingservice
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BookingDb: Host=postgres;Port=5432;Database=bookingdb;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5067:8080"

volumes:
  postgres-data:
  monolith-ai-data:
